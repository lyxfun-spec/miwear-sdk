name: Public source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  firmware-free:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --target work/python-deps -r requirements-build.txt
      - run: python -m pip install --target work/toolchain ziglang==0.13.0
      - run: python tools/check_public.py --toolchain work/toolchain/ziglang --python-deps work/python-deps
