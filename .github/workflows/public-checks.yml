name: Public source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  firmware-free:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --target work/python-deps -r requirements-build.txt
      - run: python -m pip install --target work/toolchain ziglang==0.13.0
      - run: python tools/check_public.py --toolchain work/toolchain/ziglang --python-deps work/python-deps
